<div>
  <!-- Stays at the top while scrolling; buttons wrap instead of overlapping in a narrow window -->
  <div class="home-toolbar">
    @if (updateAvailable) {
      <button type="button" class="btn btn-sm btn-success" (click)="promptForUpdate()">
        Update Available - Click to Install
      </button>
    }
    <div class="home-toolbar-end">
      @if (hasUnreadSmack) {
        <button type="button" class="btn btn-sm btn-secondary" (click)="clearSmack()">
          Clear All Smack Talk Notifications
        </button>
      }
      <button type="button" class="btn btn-sm btn-secondary" [disabled]="refreshDisabled" (click)="refresh()">
        Refresh
      </button>
    </div>
  </div>
  @if (errorLoading) {
    <h1>There was an error loading your games. Please check your internet connection.</h1>
  }
  @if (!errorLoading) {
    @if (games?.length === 0) {
      <h1>You have no games. :(</h1>
    }
    @if (games) {
      <div>
        @for (game of sortedTurns; track game) {
          <div>
            <pydt-game
              [game]="game"
              [user]="user"
              (smackRead)="smackRead(game.gameId, $event)"
              [discoursePostNumber]="discourseInfo[game.gameId]"
              [gamePlayerProfiles]="gamePlayerProfiles"
              [yourTurn]="game.yourTurn"
            ></pydt-game>
          </div>
        }
      </div>
    }
  }
</div>
