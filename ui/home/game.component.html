@if (!!games) {
  <div class="card" [ngClass]="{ 'card-primary': yourTurn }">
    <div class="card-header game-header">
      <a class="game-title" href="javascript:void(0)" (click)="openGameOnWeb()" [title]="gameTitle">
        <img src="https://playyourdamnturn.com/img/game_{{ civGame?.id }}.png?v=2" alt="" />
        <span>{{ gameTitle }}</span>
      </a>
      @if (game.gameTurnRangeKey > 1) {
        <small class="game-meta">Round {{ game.round }} · {{ lastTurnText$ | async }}</small>
      }
    </div>
    <div class="card-body">
      <div class="row" style="padding-left: 13px; padding-right: 13px">
        <pydt-game-players [game]="game" [gamePlayerProfiles]="gamePlayerProfiles"></pydt-game-players>
      </div>
      @if (newDiscoursePost) {
        <div>
          <button type="submit" class="btn btn-primary btn-sm d-block w-100" (click)="readSmack()">
            Read New Smack Talk Post!
          </button>
        </div>
      }
      @if (yourTurn && game.gameTurnRangeKey > 1) {
        <div>
          <button type="submit" class="btn btn-primary btn-sm d-block w-100" (click)="playTurn()">
            {{ playText }}
          </button>
        </div>
      }
      @if (yourTurn && game.gameTurnRangeKey === 1) {
        <div>
          <button type="submit" class="btn btn-primary btn-sm d-block w-100" (click)="openGameOnWeb()">
            You must submit the initial game turn on the website.
          </button>
        </div>
      }
    </div>
  </div>
}
